document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #131A17; }\n  a { color: #D4A94E; text-decoration: none; border-bottom: 1px solid #6B5A2E; overflow-wrap: anywhere; }\n  a:hover { color: #E8C169; border-bottom-color: #E8C169; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: #131A17; font-family: 'Public Sans', sans-serif; font-size: 16.5px; line-height: 1.65; color: #E9E4D8;\">\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Startseite\" style=\"max-width: 1020px; margin: 0 auto; padding: 84px 36px 72px;\">\n      <div style=\"font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #D4A94E; font-weight: 500; margin-bottom: 26px;\">Englisch · Gymnasium<\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 58px; line-height: 1.08; margin: 0 0 26px; max-width: 18ch; text-wrap: balance; color: #F4EFE2;\">Selbstverantwortlich Englisch lernen mit KI<\u002Fh1>\n      <p style=\"max-width: 62ch; margin: 0 0 12px; font-size: 18px; font-weight: 300; color: #B9B5A5; text-wrap: pretty;\">Eine Materialsammlung von Lehrpersonen für Lehrpersonen: erprobte Unterrichtsprojekte, bei denen Schülerinnen und Schüler KI als Trainingspartner und nicht als Abkürzung nutzen. In der Regel enthält jedes Projekt einen Lektionsplan, den konkreten Prompt, ein Arbeitsbeispiel und Rückmeldungen aus dem Kurs. Einzelne Projekte bieten zusätzlich Materialien zum Herunterladen.<\u002Fp>\n      <p style=\"max-width: 62ch; margin: 0 0 32px; font-size: 18px; font-weight: 300; color: #B9B5A5; text-wrap: pretty;\">Alle Materialien sind auf die Sekundarstufe II zugeschnitten und dürfen frei angepasst werden<span sc-camel-on-click=\"{{ goFootnote }}\" title=\"Hinweis zur Quellenangabe\" style=\"color: #D4A94E; cursor: pointer; padding: 0 2px;\" style-hover=\"color: #E8C169;\">*<\u002Fspan>. Die Projektseiten sind auf Englisch verfasst.<\u002Fp>\n      <div sc-camel-on-click=\"{{ goTipps }}\" style=\"display: inline-flex; align-items: center; gap: 10px; margin: 0 0 60px; padding: 13px 22px; border: 1px solid #6B5A2E; border-radius: 4px; color: #D4A94E; font-size: 15.5px; font-weight: 500; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;\" style-hover=\"border-color: #D4A94E; background: #1B2420;\"><span>Wichtige Erkenntnisse und Tipps<\u002Fspan><span>→<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-bottom: 56px;\">\n        <sc-for list=\"{{ tiles }}\" as=\"tile\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ tile.onOpen }}\" style=\"background: #1B2420; border: 1px solid #2E3A34; border-radius: 4px; padding: 30px 28px 26px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: border-color 0.15s ease, background 0.15s ease;\" style-hover=\"border-color: {{ tile.accent }}; background: #202B26;\">\n            <div style=\"font-family: 'Newsreader', serif; font-size: 28px; font-weight: 500; color: #F4EFE2;\">{{ tile.en }}<\u002Fdiv>\n            <div style=\"font-size: 13.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8B8878;\">{{ tile.de }}<\u002Fdiv>\n            <div style=\"margin-top: 16px; font-size: 14px; color: {{ tile.accent }}; font-weight: 500; display: flex; align-items: center; gap: 8px;\"><span>{{ tile.countLabel }}<\u002Fspan><span>→<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasTeacherTile }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-bottom: 76px; display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #7FC1B8; font-weight: 500;\">Für Lehrpersonen<\u002Fdiv>\n            <p style=\"margin: 0; max-width: 62ch; font-size: 15.5px; font-weight: 300; color: #B9B5A5; text-wrap: pretty;\">Diese Projekte sind nicht zum selbstständigen Üben für Schülerinnen und Schüler gedacht, sondern unterstützen Lehrpersonen bei der Vorbereitung von Unterricht und Prüfungen.<\u002Fp>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ teacherTile.onOpen }}\" style=\"background: #1B2420; border: 1px solid #2E3A34; border-left: 1px solid #2E3A34; border-radius: 4px; padding: 30px 28px 26px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: border-color 0.15s ease, background 0.15s ease;\" style-hover=\"border-color: #7FC1B8; background: #202B26;\">\n            <div style=\"font-family: 'Newsreader', serif; font-size: 28px; font-weight: 500; color: #F4EFE2;\">{{ teacherTile.en }}<\u002Fdiv>\n            <div style=\"font-size: 13.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #8B8878;\">{{ teacherTile.de }}<\u002Fdiv>\n            <div style=\"margin-top: 16px; font-size: 14px; color: #7FC1B8; font-weight: 500; display: flex; align-items: center; gap: 8px;\"><span>{{ teacherTile.countLabel }}<\u002Fspan><span>→<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"border-top: 1px solid #2E3A34; padding-top: 40px; display: flex; flex-wrap: wrap; gap: 48px; justify-content: space-between; align-items: flex-start;\">\n        <div style=\"max-width: 46ch;\">\n          <div style=\"font-family: 'Newsreader', serif; font-size: 23px; font-weight: 500; margin-bottom: 8px; color: #F4EFE2;\">Kontakt<\u002Fdiv>\n          <p style=\"margin: 0 0 22px; color: #B9B5A5; font-weight: 300; font-size: 15.5px;\">Fragen, eigene Projekte oder Erfahrungsberichte? Wir freuen uns über Rückmeldungen von anderen Lehrpersonen.<\u002Fp>\n          <div sc-camel-on-click=\"{{ goKontakt }}\" style=\"display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border: 1px solid #6B5A2E; border-radius: 4px; color: #D4A94E; font-size: 15px; font-weight: 500; cursor: pointer;\" style-hover=\"border-color: #D4A94E; color: #E8C169;\">Zum Kontaktformular →<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"fn-quelle\" style=\"font-size: 13.5px; color: #A8A493; padding-top: 8px; max-width: 46ch;\"><span style=\"color: #D4A94E;\">*<\u002Fspan> Unsere Prompts und Assistenten können gerne heruntergeladen, verwendet und angepasst werden. Bitte geben Sie als Quelle diese Seite an.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: 36px; padding-top: 20px; border-top: 1px solid #2E3A34; font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 28px;\"><span sc-camel-on-click=\"{{ goVerdankungen }}\" style=\"color: #8B8878; cursor: pointer; border-bottom: 1px solid #3A4A42;\" style-hover=\"color: #D4A94E; border-bottom-color: #6B5A2E;\">Verdankungen<\u002Fspan><span sc-camel-on-click=\"{{ goDatenschutz }}\" style=\"color: #8B8878; cursor: pointer; border-bottom: 1px solid #3A4A42;\" style-hover=\"color: #D4A94E; border-bottom-color: #6B5A2E;\">Impressum &amp; Datenschutz<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isKontakt }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Kontakt\" style=\"max-width: 640px; margin: 0 auto; padding: 56px 36px 96px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #D4A94E; font-weight: 500; cursor: pointer; margin-bottom: 48px;\" style-hover=\"color: #E8C169;\">← Startseite<\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 44px; line-height: 1.08; margin: 0 0 22px; color: #F4EFE2;\">Kontakt<\u002Fh1>\n      <p style=\"margin: 0 0 36px; font-size: 17px; font-weight: 300; color: #B9B5A5; text-wrap: pretty;\">Fragen, eigene Projekte oder Erfahrungsberichte? Wir freuen uns über Rückmeldungen von anderen Lehrpersonen.<\u002Fp>\n      <sc-if value=\"{{ formSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 18px 20px; border: 1px solid #6B5A2E; border-radius: 4px; color: #D4A94E; font-size: 15.5px;\">Vielen Dank! Ihre Nachricht ist bei uns angekommen.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ submitForm }}\" style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;\">\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #8B8878; letter-spacing: 0.02em;\">Name<input type=\"text\" required=\"\" value=\"{{ fName }}\" sc-camel-on-change=\"{{ onName }}\" style=\"width: 100%; box-sizing: border-box; padding: 11px 14px; background: #18211D; border: 1px solid #2E3A34; border-radius: 4px; color: #E9E4D8; font-family: 'Public Sans', sans-serif; font-size: 15px; outline: none;\" style-focus=\"border-color: #6B5A2E;\"><\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #8B8878; letter-spacing: 0.02em;\">E-Mail<input type=\"email\" required=\"\" value=\"{{ fEmail }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"width: 100%; box-sizing: border-box; padding: 11px 14px; background: #18211D; border: 1px solid #2E3A34; border-radius: 4px; color: #E9E4D8; font-family: 'Public Sans', sans-serif; font-size: 15px; outline: none;\" style-focus=\"border-color: #6B5A2E;\"><\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #8B8878; letter-spacing: 0.02em;\">Schule (optional)<input type=\"text\" value=\"{{ fSchool }}\" sc-camel-on-change=\"{{ onSchool }}\" style=\"width: 100%; box-sizing: border-box; padding: 11px 14px; background: #18211D; border: 1px solid #2E3A34; border-radius: 4px; color: #E9E4D8; font-family: 'Public Sans', sans-serif; font-size: 15px; outline: none;\" style-focus=\"border-color: #6B5A2E;\"><\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #8B8878; letter-spacing: 0.02em;\">Nachricht<textarea required=\"\" rows=\"5\" value=\"{{ fMessage }}\" sc-camel-on-change=\"{{ onMessage }}\" style=\"width: 100%; box-sizing: border-box; padding: 11px 14px; background: #18211D; border: 1px solid #2E3A34; border-radius: 4px; color: #E9E4D8; font-family: 'Public Sans', sans-serif; font-size: 15px; outline: none; resize: vertical; line-height: 1.55;\" style-focus=\"border-color: #6B5A2E;\"><\u002Ftextarea><\u002Flabel>\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px;\">\n            <button type=\"submit\" disabled=\"{{ formSending }}\" style=\"padding: 12px 24px; background: transparent; border: 1px solid #6B5A2E; border-radius: 4px; color: #D4A94E; font-family: 'Public Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer;\" style-hover=\"border-color: #D4A94E; color: #E8C169;\">{{ submitLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size: 14px; color: #D98A6A;\">Senden fehlgeschlagen. Bitte versuchen Sie es später noch einmal.<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size: 12.5px; color: #6F6D5F;\">Ihre Nachricht wird über den Dienst Web3Forms an uns weitergeleitet.<\u002Fdiv>\n        <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isTipps }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Tipps\" style=\"max-width: 780px; margin: 0 auto; padding: 56px 36px 96px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #D4A94E; font-weight: 500; cursor: pointer; margin-bottom: 48px;\" style-hover=\"color: #E8C169;\">← Startseite<\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 44px; line-height: 1.08; margin: 0 0 22px; color: #F4EFE2;\">Wichtige Erkenntnisse und Tipps<\u002Fh1>\n      <p style=\"margin: 0 0 52px; max-width: 62ch; font-size: 17px; font-weight: 300; color: #B9B5A5; text-wrap: pretty;\">Da ja die Entwicklung rasant ist, wurden (und wohl werden) auch manche Tipps bald obsolet, weshalb wir uns auf die wichtigsten beschränken <span style=\"white-space: nowrap;\">(Stand: September 2026)<\u002Fspan>.<\u002Fp>\n  \n      <div style=\"display: flex; flex-direction: column; border-bottom: 1px solid #2E3A34;\">\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Man lasse sich nicht verrückt machen, welches LLM in welchem Bereich gerade jetzt etwas besser sei als andere, sondern man bleibe bei der Unterrichtsvorbereitung (z.B. zum iterativ gute Prompts entwickeln) bei einem der drei besten (von Anthropic, Google oder OpenAI) für ca. 20 Dollar pro Monat – oder als Lp an einer SekII-Schule im Kanton Zürich (und wohl manchen anderen Orten) kriegt man die gleiche oder mindestens ähnlich gute Qualität sogar <em>kostenfrei<\u002Fem> und <em>datenschutzkonform<\u002Fem>, wenn man den <em>«Copilot (Chat)»<\u002Fem> &gt; «Tiefere Analyse» im schulischen Microsoft 365 verwendet.<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Primär aus Datenschutzgründen dürfte man bei der Anwendung durch ganze Klassen kaum um «fobizz»-«Klassenräume» herumkommen; bis ca. Sommer 2025 waren diverse aufwändige und mühsame Workarounds etc. nötig, weil «fobizz» damals in diverser Hinsicht schlecht war (Usability; die «KI-Assistenten» reagierten zu langsam; zu schlechte LLMs, die zu wenig lang nachdachten); inzwischen ist es unserer Meinung nach (uMn) recht gut und wird immer besser – aber man muss sich nach wie vor insbesondere zweier Punkte bewusst sein:<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 18px 22px; background: #18211D; border-radius: 4px; font-size: 15.5px; font-weight: 300; color: #BDB9A9; text-wrap: pretty;\">\n              <div style=\"display: grid; grid-template-columns: 7px minmax(0,1fr); gap: 14px; align-items: start;\"><div style=\"width: 7px; height: 7px; margin-top: 10px; border: 1px solid #D4A94E; border-radius: 50%; box-sizing: border-box;\"><\u002Fdiv><div>Man darf nicht die gleiche Qualität erwarten wie allein in seinem bezahlten Modell, wenn ganze Klassen gleichzeitig in einem «fobizz»-«Klassenraum» das Gleiche tun (im Umkehrschluss: die Prompts in den «KI-Assistenten» von «fobizz» müssen noch besser sein)<\u002Fdiv><\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 7px minmax(0,1fr); gap: 14px; align-items: start;\"><div style=\"width: 7px; height: 7px; margin-top: 10px; border: 1px solid #D4A94E; border-radius: 50%; box-sizing: border-box;\"><\u002Fdiv><div>(Spätestens) nach einem Jahr wird in einem «fobizz»-«Klassenraum» gnadenlos alles automatisch gelöscht.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Der wohl niederschwelligste Zugang zu verschiedenen KI-Modellen ist <a href=\"https://duck.ai\" target=\"_blank\">duck.ai<\u002Fa>, wo man verschiedene LLMs ausprobieren kann, ohne sich anmelden zu müssen – allerdings kann eine Lp, im Gegensatz zu «fobizz», keinen Einblick nehmen in die Arbeit der SuS. Gemäss den Betreibern sind alle Chats privat. Zu beachten ist allerdings, dass duck.ai (Stand: September 2026) nur schnelle Modelle anbietet, keine sogenannten «Denkmodelle» (Reasoning-Modelle), die vor dem Antworten länger «nachdenken». Für einfachere Übungen genügt das in der Regel; bei anspruchsvolleren Aufgaben (z.B. differenziertes Feedback auf längere Texte) sind die Resultate uMn oft weniger zuverlässig.<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Man lasse die SuS, wann immer sinnvoll, zu zweit auf einem Gerät mit KI drauf arbeiten:<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 18px 22px; background: #18211D; border-radius: 4px; font-size: 15.5px; font-weight: 300; color: #BDB9A9; text-wrap: pretty;\">\n              <div style=\"display: grid; grid-template-columns: 7px minmax(0,1fr); gap: 14px; align-items: start;\"><div style=\"width: 7px; height: 7px; margin-top: 10px; border: 1px solid #D4A94E; border-radius: 50%; box-sizing: border-box;\"><\u002Fdiv><div>Didaktisch-pädagogischer Hauptvorteil: sie reden auch miteinander auf Englisch, anstatt dass alle die ganze Zeit auf einen Bildschirm starren<\u002Fdiv><\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 7px minmax(0,1fr); gap: 14px; align-items: start;\"><div style=\"width: 7px; height: 7px; margin-top: 10px; border: 1px solid #D4A94E; border-radius: 50%; box-sizing: border-box;\"><\u002Fdiv><div>Pragmatische Vorteile: viel weniger Tech-Probleme (d.h. man kann sich auf den Inhalt konzentrieren) und die Bots dürften tendenziell besseren Output liefern, wenn z.B. in «fobizz» 13 statt 26 ‘Anfragen’ mehr oder weniger gleichzeitig kommen.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Man stelle den SuS (insbesondere Klassen mit jüngeren SuS ohne KI-Erfahrung) genaue Anleitungen zur Verfügung (man darf gerne unsere kopieren und anpassen)<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Man ‘verpacke’ einen Prompt grundsätzlich in einem Bot (in «fobizz» ja «KI-Assistent» genannt), weil so die SuS schneller zum Arbeiten kommen – ausser in Fällen, wo die Kenntnis bzw. Verfügbarkeit des <em>Prompts<\u002Fem> auch in Zukunft von Nutzen ist für die SuS, sinnvollerweise wohl mit einer noch genaueren Anleitung.<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Wie man einen guten Prompt entwickelt etc., zeigen Hansjürg und Michael in einem Live-Webinar (bis zum 17.09.2026 1121 Bewertungen mit einem Schnitt von 4.5 von 5 Sternen; «fobizz»-Login erforderlich): <a href=\"https://app.fobizz.com/fortbildungen/3377-prompts-zum-selbstlernen-im-fremdsprachunterricht\" target=\"_blank\">«Prompts zum Selbstlernen im Fremdsprachunterricht»<\u002Fa> – aber man kann natürlich gerne einfach unsere auf dieser Website kopieren und leicht anpassen, was wesentlich weniger aufwändig ist (bitte in diesen Fällen <strong style=\"font-weight: 500; color: #F4EFE2;\">den Link zu dieser Website als Quelle angeben<\u002Fstrong>).<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Marija zeigt im Rahmen eines Input-Calls, wie KI die tägliche Arbeit von Sprachlehrpersonen unterstützen kann. Vorgestellt wird ein Prompt zur Erstellung des Wortschatzteils von Prüfungen, mit dem verschiedene Aufgabentypen (Übersetzungen, Definitionen, Lückentexte, etc.) schnell und gezielt generiert werden können. Der Schwerpunkt liegt darauf, KI auch als zeitsparendes Instrument für die Unterrichts- und Prüfungsvorbereitung zu nutzen. Der Prompt kann auf unserer Webseite direkt kopiert werden: <a href=\"https://dlh.zh.ch/home/impuls-workshops/sprachen?view=article&amp;id=1181:pruefungen-erstellen-mit-ki&amp;catid=188\" target=\"_blank\">«Prüfungen erstellen mit KI»<\u002Fa>.<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Man kann uns gerne ‘anstellen’, entweder <strong style=\"font-weight: 500; color: #F4EFE2;\">für ein Webinar oder vor Ort an der eigenen Schule<\u002Fstrong> – ein halber Tag dürfte sehr sinnvoll sein; noch besser ein ganzer Tag gefolgt von einem halben Tag online ein paar Wochen später, so dass man in der Zwischenzeit mit eigenen Klassen ‘Dinge’ 1:1 ausprobieren kann (so machen es Prof. Schneider, Hansjürg und Michael 1x pro Jahr am «IfE» der Universität Zürich).<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Ein Tipp für in Sachen KI fortgeschrittene Englisch-Lp: Gian Peter Ochsner (<strong style=\"font-weight: 500; color: #F4EFE2;\">GPO<\u002Fstrong>) gab unserer Meinung nach zwei hervorragende «Impuls-Workshops»:<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 18px 22px; background: #18211D; border-radius: 4px; font-size: 15px; font-weight: 300; color: #BDB9A9; text-wrap: pretty;\">\n              <div style=\"display: grid; grid-template-columns: 7px minmax(0,1fr); gap: 14px; align-items: start;\"><div style=\"width: 7px; height: 7px; margin-top: 10px; border: 1px solid #D4A94E; border-radius: 50%; box-sizing: border-box;\"><\u002Fdiv><div><a href=\"https://dlh.zh.ch/home/impuls-workshops/sprachen?view=article&amp;id=1178:sokratischer-literatur-tutor-interpretationskompetenz-mit-ki&amp;catid=188\" target=\"_blank\">«Sokratischer Literatur-Tutor: Interpretationskompetenz mit KI»<\u002Fa><\u002Fdiv><\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 7px minmax(0,1fr); gap: 14px; align-items: start;\"><div style=\"width: 7px; height: 7px; margin-top: 10px; border: 1px solid #D4A94E; border-radius: 50%; box-sizing: border-box;\"><\u002Fdiv><div><a href=\"https://dlh.zh.ch/home/impuls-workshops/sprachen?view=article&amp;id=1196:litchat-figuren-simulator-fuer-den-literaturunterricht&amp;catid=188\" target=\"_blank\">«LitChat: Figuren-Simulator für den Literaturunterricht»<\u002Fa><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Ein Tipp für fortgeschrittene KI-User: vor allem Hansjürg demonstriert ein zeitgemässes Vorgehen (4B-Modell) und zeitgemässes Prompten (ZIEL): <a href=\"https://dlh.zh.ch/home/genki-archive-2026/172-reihe-ki-chatgpt-hands-on/1150-denken-mit-ki-bewaehrtes-prompting-im-wandel\" target=\"_blank\">«Denken mit KI: Bewährtes Prompting im Wandel»<\u002Fa>.<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Nicht immer braucht es einen eigenen Prompt: Es gibt bereits zahlreiche digitale Angebote, die KI sinnvoll für selbstverantwortliches Lernen einsetzen. Ein Beispiel ist der kostenlose Microsoft Reading Coach. Das Tool ermöglicht ein individuelles und selbstständiges Training der Leseflüssigkeit und passt die Inhalte mithilfe von KI gezielt an Wörter an, mit denen Lernende Schwierigkeiten haben. Reading Coach kann sowohl im Unterricht als auch zu Hause genutzt werden.<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Dass es auf dieser Website nur wenige Projekte zum Sprechen gibt, hat zwei Gründe: Erstens ist der Datenschutz bei Sprachaufnahmen besonders heikel, da die Stimme ein persönliches Merkmal ist, und «fobizz» bietet keinen Sprachmodus an, sodass es für ganze Klassen bisher kaum datenschutzkonforme Lösungen gab. Zweitens war der Sprachmodus (voice mode) der KI-Chatbots bis vor Kurzem uMn schlicht zu wenig gut, um ihn sinnvoll im Unterricht einzusetzen. Inzwischen hat sich die Qualität deutlich verbessert, weshalb es in Zukunft vielleicht vermehrt Sprechprojekte geben wird.<\u002Fdiv>\n        <\u002Fdiv>\n  \n      <\u002Fdiv>\n  \n      <p style=\"margin: 36px 0 0; font-family: 'Newsreader', serif; font-style: italic; font-size: 20px; color: #D4A94E;\"><span sc-camel-on-click=\"{{ goKontakt }}\" style=\"cursor: pointer; border-bottom: 1px solid #6B5A2E;\" style-hover=\"color: #E8C169; border-bottom-color: #E8C169;\">Für weitere Tipps darf man uns gern anfragen.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDatenschutz }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Datenschutz\" style=\"max-width: 780px; margin: 0 auto; padding: 56px 36px 96px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #D4A94E; font-weight: 500; cursor: pointer; margin-bottom: 48px;\" style-hover=\"color: #E8C169;\">← Startseite<\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 44px; line-height: 1.08; margin: 0 0 40px; color: #F4EFE2;\">Impressum &amp; Datenschutz<\u002Fh1>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n        <div style=\"font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; color: #F4EFE2;\">Impressum<\u002Fdiv>\n        <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Diese Website ist das Ergebnis eines Projekts, das vom <a href=\"https://dlh.zh.ch\" target=\"_blank\">Digital Learning Hub<\u002Fa> unterstützt wurde. Beteiligt waren folgende Lehrpersonen:<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 10px;\">\n          <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 16px; align-items: baseline;\"><div style=\"width: 14px; height: 1px; background: #D4A94E; align-self: center;\"><\u002Fdiv><div style=\"font-weight: 300; color: #DCD7C9;\"><strong style=\"font-weight: 500; color: #F4EFE2;\">Michael Beusch<\u002Fstrong>, Kantonsschule Rychenberg<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 16px; align-items: baseline;\"><div style=\"width: 14px; height: 1px; background: #D4A94E; align-self: center;\"><\u002Fdiv><div style=\"font-weight: 300; color: #DCD7C9;\"><strong style=\"font-weight: 500; color: #F4EFE2;\">Marija Josifovic<\u002Fstrong>, Kantonsschule Zürcher Unterland<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 16px; align-items: baseline;\"><div style=\"width: 14px; height: 1px; background: #D4A94E; align-self: center;\"><\u002Fdiv><div style=\"font-weight: 300; color: #DCD7C9;\"><strong style=\"font-weight: 500; color: #F4EFE2;\">Ralph Kilchenmann<\u002Fstrong>, Kantonsschule Hottingen<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty; margin-top: 18px;\">Verantwortlich für Inhalt und Datenschutz (Webmaster): <strong style=\"font-weight: 500; color: #F4EFE2;\">Ralph Kilchenmann<\u002Fstrong>, Kantonsschule Hottingen. Kontakt über das <span sc-camel-on-click=\"{{ goKontakt }}\" style=\"color: #D4A94E; cursor: pointer; border-bottom: 1px solid #6B5A2E;\" style-hover=\"color: #E8C169;\">Kontaktformular<\u002Fspan>.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Newsreader', serif; font-size: 30px; font-weight: 500; color: #F4EFE2; margin: 56px 0 8px;\">Datenschutz<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; border-bottom: 1px solid #2E3A34;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; color: #F4EFE2;\">Besucherstatistik<\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Wir verwenden <a href=\"https://www.goatcounter.com\" target=\"_blank\">GoatCounter<\u002Fa> für anonyme Besucherstatistiken. Es werden keine Cookies gesetzt und keine personenbezogenen Daten gespeichert.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; color: #F4EFE2;\">Kontaktformular<\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">Nachrichten über das Kontaktformular werden über den Dienst <a href=\"https://web3forms.com\" target=\"_blank\">Web3Forms<\u002Fa> per E-Mail an uns weitergeleitet und nur zur Beantwortung Ihrer Anfrage verwendet.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isVerdankungen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Verdankungen\" style=\"max-width: 780px; margin: 0 auto; padding: 56px 36px 96px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #D4A94E; font-weight: 500; cursor: pointer; margin-bottom: 48px;\" style-hover=\"color: #E8C169;\">← Startseite<\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 44px; line-height: 1.08; margin: 0 0 22px; color: #F4EFE2;\">Verdankungen<\u002Fh1>\n      <p style=\"margin: 0 0 52px; font-size: 17px; font-weight: 300; color: #B9B5A5;\">Wir bedanken uns herzlich bei:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; border-bottom: 1px solid #2E3A34;\">\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\"><strong style=\"font-weight: 500; color: #F4EFE2;\">Natalie Streiff<\u002Fstrong> und <strong style=\"font-weight: 500; color: #F4EFE2;\">Jürg Widrig<\u002Fstrong> vom <a href=\"https://dlh.zh.ch\" target=\"_blank\">DLH<\u002Fa> für die Betreuung unseres Innovationsfonds-Projekts<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">den teilnehmenden Lp und Mitgliedern der SL der <a href=\"https://www.kzo.ch\" target=\"_blank\">KZO<\u002Fa>, insbesondere <strong style=\"font-weight: 500; color: #F4EFE2;\">Nurja Bischoff<\u002Fstrong> als Organisatorin: als unsere (HP und McB) Arbeit noch very much work in progress war, durften wir sie in zwei Workshops in Wetzikon in einer sehr wohlwollenden Atmosphäre vorstellen<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">allen Teilnehmenden unserer (Hansjürg Perino und Michael Beusch) alljährlichen Weiterbildungen zum Thema am <a href=\"https://www.ife.uzh.ch\" target=\"_blank\">«IfE»<\u002Fa> der Universität Zürich sowie <strong style=\"font-weight: 500; color: #F4EFE2;\">Prof. Schneider<\u002Fstrong>, sozusagen unser Keynote-Speaker, und <strong style=\"font-weight: 500; color: #F4EFE2;\">Dr. Wittwen<\u002Fstrong> als Organisator<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">allen Teilnehmenden unserer Webinare, beim <a href=\"https://dlh.zh.ch\" target=\"_blank\">DLH<\u002Fa> und bei <a href=\"https://fobizz.com\" target=\"_blank\">«fobizz»<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\"><strong style=\"font-weight: 500; color: #F4EFE2;\">Gian Peter Ochsner<\u002Fstrong> (GPO) für seine immense Arbeit und riesige Expertise zum Thema KI zum Englischlernen sowie seine Bereitschaft, die mit uns und anderen Interessierten zu teilen<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\"><strong style=\"font-weight: 500; color: #F4EFE2;\">Hansjürg Perino<\u002Fstrong>, unserem Fach-Experten vom DLH, für sein hervorragendes didaktisches und pädagogisches Fachwissen sowie seine unserer Meinung nach phantastischen Prompts, in stunden- wenn nicht tagelanger Arbeit sehr sorgfältig iterativ entwickelt, die er uns zur ‘Weiter-Verfeinerung’ für ganze Klassen zur Verfügung stellte<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">last but not least unseren SuS, die grossmehrheitlich konstruktiv mit unseren Prompts und Bots arbeiteten und uns teilweise sehr wertvolles Feedback zu deren weiteren Verbesserung gaben<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 22px; padding: 26px 0; border-top: 1px solid #2E3A34;\">\n          <div style=\"width: 14px; height: 1px; margin-top: 13px; background: #D4A94E;\"><\u002Fdiv>\n          <div style=\"font-weight: 300; color: #DCD7C9; text-wrap: pretty;\">allen, die wir vergessen haben sollten (SORRY)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStatic }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Statische Seite\" style=\"max-width: 760px; margin: 0 auto; padding: 56px 36px 80px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #D4A94E; font-weight: 500; cursor: pointer; margin-bottom: 48px;\" style-hover=\"color: #E8C169;\">← Startseite<\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 44px; line-height: 1.08; margin: 0 0 30px; color: #F4EFE2;\">{{ staticTitle }}<\u002Fh1>\n      <div style=\"font-size: 17px; font-weight: 300; color: #C9C5B4; white-space: pre-line; max-width: 62ch; text-wrap: pretty;\">{{ staticBody }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isArea }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Bereichsseite\" style=\"max-width: 880px; margin: 0 auto; padding: 56px 36px 80px;\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #D4A94E; font-weight: 500; cursor: pointer; margin-bottom: 48px;\" style-hover=\"color: #E8C169;\">← Startseite<\u002Fdiv>\n      <div style=\"font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: {{ areaAccent }}; font-weight: 500; margin-bottom: 14px;\">{{ areaDe }}<\u002Fdiv>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 48px; line-height: 1.06; margin: 0 0 16px; color: #F4EFE2;\">{{ areaEn }}<\u002Fh1>\n      <p style=\"max-width: 60ch; margin: 0 0 46px; font-size: 17.5px; font-weight: 300; color: #B9B5A5; text-wrap: pretty;\">{{ areaDesc }}<\u002Fp>\n\n      <sc-if value=\"{{ areaIsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border: 1px dashed #3A4A42; border-radius: 4px; padding: 36px 28px; text-align: center; color: #8B8878; font-size: 16px; font-weight: 300;\">No projects in this area yet — coming soon.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"background: #1B2420; border: 1px solid #2E3A34; border-radius: 4px; overflow: hidden;\">\n            <div sc-camel-on-click=\"{{ p.onToggle }}\" style=\"display: flex; align-items: baseline; gap: 18px; padding: 19px 24px; cursor: pointer;\" style-hover=\"background: #202B26;\">\n              <div style=\"font-family: 'Newsreader', serif; font-size: 15px; font-style: italic; color: {{ areaAccent }}; min-width: 26px;\">{{ p.num }}<\u002Fdiv>\n              <div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px;\">\n                <div style=\"font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; color: #F4EFE2;\">{{ p.title }}<\u002Fdiv>\n                <sc-if value=\"{{ showMeta }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-size: 13px; letter-spacing: 0.06em; color: #8B8878;\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size: 14px; color: #D4A94E;\">{{ p.chev }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ p.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top: 1px solid #2E3A34; padding: 6px 24px 14px 68px; display: flex; flex-direction: column; background: #171F1B;\">\n                <sc-for list=\"{{ p.links }}\" as=\"l\" hint-placeholder-count=\"5\">\n                  <div sc-camel-on-click=\"{{ l.onOpen }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 2px; cursor: pointer; border-bottom: 1px solid #232D28;\" style-hover=\"color: #E8C169;\">\n                    <div style=\"font-size: 15px; font-weight: 500; color: #C9C5B4; letter-spacing: 0.02em;\">{{
